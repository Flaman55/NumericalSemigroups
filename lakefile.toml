name = "LinearQ"
version = "0.1.0"
defaultTargets = ["LinearQ", "Challenge", "Solution", "linearq"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "LinearQ"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_exe]]
name = "linearq"
root = "Main"
