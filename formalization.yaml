automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic); exact model version not recorded"]
      framework: "Claude Code"
      tool_setup: >
        Agentic sessions in May 2026 produced the original Lean files (Block1 to Block4:
        the two-generator kernel and its interval structure, the sliding-window reduction,
        the multi-generator recursive kernel, and the density asymptotics) and the LaTeX
        text of the paper. The author directed the mathematical content and reviewed the
        structure and every successful Lean build; the agent wrote and edited the Lean
        source and the paper prose.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked (subscription-based usage)"
        hardware: "author's laptop"
      prompting_notes: >
        The mathematical content (the kernel K^(n), the window structure, the density
        question and the statements of the theorems) is the author's. The agent translated
        the specified statements into Lean tactics, repaired build failures and drafted the
        paper text; it did not independently judge mathematical correctness, which is
        decided by the Lean kernel.
    - method: "agent"
      models: ["claude-sonnet-5-5"]
      framework: "Claude Cowork"
      tool_setup: >
        October 2026 session, directed by the author. The agent added `Block3_Windows.lean`
        (identification of the recursive kernel with the paper's inclusion-exclusion
        definition, breakpoints and active windows counted as intervals rather than integer
        points) and `Block5_Breakpoints.lean` (breakpoint decomposition of the quadratic
        form), ported all files to Lean's module system, wrote `Challenge.lean`,
        `Solution.lean` and `comparator.json`, and updated the toolchain and Mathlib pin to
        v4.35.0-rc2. The agent had no Lean toolchain in its sandbox: every build was run by
        the author on their machine and its output returned to the agent, which corrected
        the sources until the builds succeeded.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked (subscription-based usage)"
        hardware: "author's computer"
  spend_usd: "not tracked (subscription-based usage)"
  notes: >
    Mathematical design is the author's; Lean source and paper prose were written by agents
    under the author's direction, with all builds run and checked by the author.

fidelity:
  divergences: >
    The following differences between the paper and the Lean development are known.
    (a) Theorem 1.5 in the paper assumes the generators are pairwise distinct integers
    >= 2 with log p_n = o(n); the Lean statement assumes the stronger hypothesis that the
    generator sequence is strictly increasing (and >= 2), which implies distinctness.
    (b) The paper takes G to be the gap set N minus the semigroup generated by the
    generators; the Lean statements hold for an arbitrary finite set G of integers and
    arbitrary real weights, which includes that case. (c) The paper defines active windows
    as intervals between consecutive breakpoints; the Lean development counts them by
    their left endpoints, i.e. as breakpoints s in [0, sigma) at which the kernel jumps to a
    nonzero value. (d) The generators are a list, and sub-multisets are taken with
    multiplicity, which agrees with the paper's subsets for distinct generators. (e) The
    running-time statements of Theorems 1.1 and 1.2 (O(N), O(n sigma_n)) are not formalized;
    only the algebraic identities from which the algorithms are derived are. (f) The
    paper's numerical tables, the empirical claim w(n) ~ sigma_n, and its conjectures are
    not formalized. The paper's prose was drafted by an agent (see `automation`); this
    note records content differences, not independent authorship of the text.

review:
  status: "self-assessed"
  reviewers: ["Artur Flamandzki"]
  notes: >
    The author directed the mathematics and ran and checked every Lean build, but did not
    independently read the agent-written Lean source line by line. Axiom-cleanliness of the
    submitted declarations is checked by Comparator.

alignment:
  namespace: "LinearQ"
  statements:
    - source: "Theorem 1.1 (Linear algorithm, two generators)"
      lean: "LinearQ.quadForm_eq_linearForm"
      module: "LinearQ/Block2_QReduction.lean"
      status: "proved"
      note: "Algebraic identity only; the O(N) running-time claim is not formalized."
    - source: "Theorem 1.2 (Sliding-window algorithm, n generators), decomposition"
      lean: "LinearQ.quadFormMulti_eq_breakpoint_sum"
      module: "LinearQ/Block5_Breakpoints.lean"
      status: "proved"
      note: "Exact breakpoint decomposition of Q; complexity claims are not formalized."
    - source: "Lemma 4.1 (w(n) <= sigma_n)"
      lean: "LinearQ.activeWindowCount_le_sigma"
      module: "LinearQ/Block3_Windows.lean"
      status: "proved"
      note: "Windows counted by left endpoints; see fidelity (c)."
    - source: "Theorem 1.5 (Density asymptotics)"
      lean: "LinearQ.windowCount_isLittleO_mertensProd"
      module: "LinearQ/Block4_DensityAsymptotic.lean"
      status: "proved"
      note: "Hypothesis strengthened to strictly increasing generators; see fidelity (a)."
    - source: "Theorem 1.5 (equivalent form delta(n)/P(n) -> 1)"
      lean: "LinearQ.gap_div_mertens_tendsto_one"
      module: "LinearQ/Block4_DensityAsymptotic.lean"
      status: "proved"
      note: "Same hypotheses as the previous entry."

